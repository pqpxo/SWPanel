<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SWPanel</title>
  <desc id="desc">SWPanel, a drag-and-drop designer for ESPHome and LVGL touch panels on Home Assistant. A 480 by 320 dashboard has its TV tile selected with drag handles, and three steps run from drag and drop, through live states, to Get YAML.</desc>

  <rect width="1200" height="420" rx="24" fill="#13274A"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" letter-spacing="1.5" fill="#9DB4E8">ESPHOME · LVGL · HOME ASSISTANT</text>
    <text x="64" y="186" font-size="92" font-weight="700" fill="#FFFFFF" textLength="372" lengthAdjust="spacingAndGlyphs">SWPanel</text>
    <rect x="52" y="102" width="396" height="104" fill="none" stroke="#5AB0FF" stroke-width="2"/>
    <rect x="47" y="97" width="10" height="10" fill="#E8F3FF" stroke="#5AB0FF" stroke-width="2"/>
    <rect x="443" y="97" width="10" height="10" fill="#E8F3FF" stroke="#5AB0FF" stroke-width="2"/>
    <rect x="47" y="201" width="10" height="10" fill="#E8F3FF" stroke="#5AB0FF" stroke-width="2"/>
    <rect x="443" y="201" width="10" height="10" fill="#E8F3FF" stroke="#5AB0FF" stroke-width="2"/>
    <text x="64" y="256" font-size="30" fill="#E4E8F0">Design your touch panel by dragging.</text>
    <text x="64" y="298" font-size="30" fill="#E4E8F0">Paste the YAML into ESPHome Builder.</text>
  </g>

  <g id="steps" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="64" y="328" width="150" height="44" rx="22" fill="#242E42" stroke="#3B4252"/>
    <text x="139.0" y="357" text-anchor="middle" font-size="20" font-weight="600" fill="#E4E8F0">Drag &amp; drop</text>
    <path d="M222 350H242M235 343l7 7-7 7" fill="none" stroke="#8F98AA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="250" y="328" width="150" height="44" rx="22" fill="#242E42" stroke="#3B4252"/>
    <text x="325.0" y="357" text-anchor="middle" font-size="20" font-weight="600" fill="#E4E8F0">Live states</text>
    <path d="M408 350H428M421 343l7 7-7 7" fill="none" stroke="#8F98AA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="436" y="328" width="126" height="44" rx="8" fill="#F2CF66" stroke="#F2CF66"/>
    <text x="499.0" y="357" text-anchor="middle" font-size="20" font-weight="600" fill="#13274A">Get YAML</text>
  </g>

