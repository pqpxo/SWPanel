# https://contributors.home-assistant.io/apps/reference/configuration/
name: SWPanel
version: "1.2.0"
slug: swpanel
description: Drag-and-drop designer for ESPHome LVGL touch panels
url: https://github.com/pqpxo/SWPanel
arch:
  - aarch64
  - amd64
startup: application
ingress: true
ingress_port: 8095
panel_icon: mdi:tablet-dashboard
panel_title: SWPanel
homeassistant_api: true
environment:
  DATA_DIR: /data
# Off by default. Only images and the health check answer here, never the designer.
ports:
  8095/tcp: null
ports_description:
  8095/tcp: Image downloads for an ESPHome that can't reach this app internally
options:
  public_url: ""
schema:
  public_url: "str?"
